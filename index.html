<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0e" />
    <meta name="description" content="Tickwell is a premium, local-first counter app: multiple counters, seven modes, statistics, history, tools and templates. Works offline, no account needed." />
    <title>Tickwell — Counter Studio</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('tickwell.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        else if (t === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-label="Loading Tickwell" role="status">
        <div class="boot-mark"></div>
      </div>
    </div>
    <noscript>Tickwell needs JavaScript to run. Everything stays on your device.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
