<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0e" />
    <meta name="description" content="Tickwell is a premium, local-first counter app: multiple counters, seven modes, statistics, history, tools and templates. Works offline, no account needed." />
    <title>Tickwell — Counter Studio</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('tickwell.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        else if (t === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-label="Loading Tickwell" role="status">
        <div class="boot-mark"></div>
      </div>
    </div>
    <script nomodule>
      document.getElementById('root').innerHTML =
        '<p style="font:16px system-ui;padding:24px;color:#f6f3ef">This browser is too old to run Tickwell. Please update it or try another browser.</p>';
    </script>
    <script>
      // If the app has not started (script failed to load or crashed early), say so instead of showing nothing.
      (function () {
        var errors = [];
        window.addEventListener('error', function (e) {
          errors.push((e && e.message) || 'Script error');
        });
        function show() {
          if (window.__tickwellStarted) return;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="font:16px/1.5 system-ui;padding:24px;max-width:520px;margin:0 auto;color:#f6f3ef"><h1 style="font-size:22px">Tickwell could not start</h1>' +
            '<p style="color:#a19eac">The app did not load. Try reloading. If it keeps happening, your browser may be blocking scripts or storage for this site.</p>' +
            (errors.length ? '<pre style="white-space:pre-wrap;background:#15151b;padding:12px;border-radius:10px;font-size:12px">' + String(errors[0]).replace(/</g, '&lt;') + '</pre>' : '') +
            '<button onclick="location.reload()" style="padding:10px 18px;border-radius:999px;border:0;background:#ff8a3d;color:#100e14;font-weight:600">Reload</button></div>';
        }
        window.setTimeout(show, 10000);
      })();
    </script>
    <noscript>Tickwell needs JavaScript to run. Everything stays on your device.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
