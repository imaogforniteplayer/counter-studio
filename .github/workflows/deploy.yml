name: Test, build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npx vite build

      - name: Install browser for the smoke test
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Smoke test the production build
        run: npm run smoke

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  layout:
    # Drives the real production build through every screen, menu and dialog on many screen shapes.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sizes:
          - phone-320,phone-landscape
          - phone-360,phone-390
          - phone-360-light,phone-360-bigtext
          - tablet,wide
          - laptop,laptop-light-bigtext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx vite build
      - run: npx playwright install --with-deps chromium
      - name: Layout check (${{ matrix.sizes }})
        run: npm run layout
        env:
          SIZES: ${{ matrix.sizes }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, layout]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
